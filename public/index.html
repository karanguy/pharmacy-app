<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต๊อกยา</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- หน้า ล็อกอิน -->
    <div id="login-section" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-indigo-600">🔒 ล็อกอินเข้าใช้งาน</h2>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" required class="w-full mt-1 p-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="w-full mt-1 p-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded-md hover:bg-indigo-700 font-semibold">เข้าสู่ระบบ</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- หน้า Dashboard สต๊อกยา -->
    <div id="app-section" class="hidden">
        <nav class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-lg">
            <h1 class="text-xl font-bold">💊 ระบบจัดการสต๊อกยา</h1>
            <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-semibold">ออกจากระบบ</button>
        </nav>

        <div class="container mx-auto p-4 max-w-5xl space-y-6">
            <!-- ฟอร์มเพิ่มยาใหม่ -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-lg font-bold mb-4 text-gray-800">➕ เพิ่มรายการยาใหม่</h3>
                <form onsubmit="handleAddMed(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="med_id" placeholder="รหัสยา (เช่น MED01)" required class="p-2 border rounded">
                    <input type="text" id="med_name" placeholder="ชื่อยา" required class="p-2 border rounded">
                    <input type="text" id="category" placeholder="หมวดหมู่ (เช่น ยาแก้ปวด)" class="p-2 border rounded">
                    <input type="number" id="quantity" placeholder="จำนวนเริ่มต้น" required class="p-2 border rounded">
                    <input type="text" id="unit" placeholder="หน่วยนับ (เช่น แผง, ขวด)" required class="p-2 border rounded">
                    <input type="number" id="min_stock" placeholder="เตือนเมื่อเหลือน้อยกว่า" required class="p-2 border rounded">
                    <button type="submit" class="md:col-span-3 bg-green-600 text-white p-2 rounded hover:bg-green-700 font-semibold">บันทึกยาใหม่</button>
                </form>
            </div>

            <!-- ตารางสต๊อกยา -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-lg font-bold mb-4 text-gray-800">📦 รายการสต๊อกยาปัจจุบัน</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b">
                                <th class="p-3">รหัสยา</th>
                                <th class="p-3">ชื่อยา</th>
                                <th class="p-3">หมวดหมู่</th>
                                <th class="p-3">คงเหลือ</th>
                                <th class="p-3">หน่วย</th>
                                <th class="p-3">สถานะ</th>
                                <th class="p-3">ปรับสต๊อก</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function checkAuth() {
            const res = await fetch('/api/check-auth');
            const data = await res.json();
            if (data.loggedIn) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                loadInventory();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('login-error');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (data.success) {
                errorElement.classList.add('hidden');
                checkAuth();
            } else {
                errorElement.innerText = data.message;
                errorElement.classList.remove('hidden');
            }
        }

        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            checkAuth();
        }

        async function loadInventory() {
            const res = await fetch('/api/inventory');
            if (!res.ok) return;
            const list = await res.json();
            const tbody = document.getElementById('inventory-list');
            tbody.innerHTML = '';

            list.forEach(item => {
                const isLow = item.quantity <= item.min_stock;
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3 font-semibold">${item.med_id}</td>
                    <td class="p-3">${item.med_name}</td>
                    <td class="p-3 text-gray-600">${item.category || '-'}</td>
                    <td class="p-3 font-bold ${isLow ? 'text-red-600' : 'text-gray-800'}">${item.quantity}</td>
                    <td class="p-3 text-gray-500">${item.unit}</td>
                    <td class="p-3">
                        ${isLow ? '<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">⚠️ ยาใกล้หมด</span>' : '<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">ปกติ</span>'}
                    </td>
                    <td class="p-3 space-x-1">
                        <button onclick="updateQty('${item.med_id}', ${item.quantity + 1})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">+1</button>
                        <button onclick="updateQty('${item.med_id}', ${item.quantity - 1})" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs hover:bg-yellow-600">-1</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function handleAddMed(e) {
            e.preventDefault();
            const payload = {
                med_id: document.getElementById('med_id').value,
                med_name: document.getElementById('med_name').value,
                category: document.getElementById('category').value,
                quantity: Number(document.getElementById('quantity').value),
                unit: document.getElementById('unit').value,
                min_stock: Number(document.getElementById('min_stock').value)
            };

            const res = await fetch('/api/inventory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('เพิ่มข้อมูลสำเร็จ!');
                e.target.reset();
                loadInventory();
            } else {
                const err = await res.json();
                alert(err.error);
            }
        }

        async function updateQty(medId, newQty) {
            if (newQty < 0) return alert('จำนวนคงเหลือติดลบไม่ได้');
            await fetch(`/api/inventory/${medId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ quantity: newQty })
            });
            loadInventory();
        }

        checkAuth();
    </script>
</body>
</html>
